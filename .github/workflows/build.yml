name: Build

on:
  push:
    paths-ignore:
      - '*.md'
      - '*LICENSE'
      - 'docs/**'
      - 'buildstrings/**'
      - 'config/**'
      - 'configure.py'
      - 'orig/**'
      - 'scripts/**'
      - 'sha1/**'
      - 'tools/**'
  pull_request:
    paths-ignore:
      - '*.md'
      - '*LICENSE'
      - 'docs/**'
      - 'buildstrings/**'
      - 'config/**'
      - 'configure.py'
      - 'orig/**'
      - 'scripts/**'
      - 'sha1/**'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      targets:
        description: >-
          Targets to build, space-separated, or "all": linux-x86_64 linux-aarch64 macos-arm64
          macos-x86_64 ios-arm64 android-arm64 windows-x86_64 windows-arm64
        type: string
        default: windows-x86_64 macos-arm64 linux-x86_64

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # Matrix `exclude` can't drop `include`-only entries, so the build matrices are filtered here.
  targets:
    name: Select targets
    runs-on: ubuntu-latest
    outputs:
      linux: ${{steps.select.outputs.linux}}
      apple: ${{steps.select.outputs.apple}}
      android: ${{steps.select.outputs.android}}
      windows: ${{steps.select.outputs.windows}}

    steps:
      - name: Select targets
        id: select
        env:
          # Manual runs build the requested targets. Push and pull request runs build everything.
          TARGETS: ${{ github.event_name == 'workflow_dispatch' && inputs.targets || 'all' }}
          LINUX: |
            [
              {"target": "linux-x86_64", "arch": "x86_64", "runner": "ubuntu-24.04"},
              {"target": "linux-aarch64", "arch": "aarch64", "runner": "ubuntu-24.04-arm"}
            ]
          APPLE: |
            [
              {"target": "macos-arm64", "name": "macOS arm64", "preset": "x-macos-ci-arm64",
               "package_script": "ci/build-zip.sh", "package_path": "build/install/Metaforce-*.zip"},
              {"target": "macos-x86_64", "name": "macOS x86_64", "preset": "x-macos-ci-x86_64",
               "package_script": "ci/build-zip.sh", "package_path": "build/install/Metaforce-*.zip"},
              {"target": "ios-arm64", "name": "iOS arm64", "preset": "x-ios-ci",
               "package_script": "ci/build-ipa.sh", "package_path": "build/install/Metaforce-*.ipa"}
            ]
          ANDROID: |
            [
              {"target": "android-arm64"}
            ]
          WINDOWS: |
            [
              {"target": "windows-x86_64", "arch": "x86_64", "msvc_arch": "x64"},
              {"target": "windows-arm64", "arch": "arm64", "msvc_arch": "amd64_arm64"}
            ]
        run: |
          want=" ${TARGETS//,/ } "
          known=""
          for group in linux apple android windows; do
            all=$(printenv "${group^^}")
            known+=" $(jq -r '.[].target' <<<"$all" | tr '\n' ' ')"
            selected=$(jq -c --arg want "$want" \
              'map(.target as $t | select(($want | contains(" all ")) or ($want | contains(" \($t) "))))' \
              <<<"$all")
            echo "$group=$selected" >> "$GITHUB_OUTPUT"
            echo "$group: $selected"
          done
          for target in $want; do
            if [[ "$target" != all && " $known " != *" $target "* ]]; then
              echo "::error::Unknown target '$target'. Known targets:$known"
              exit 1
            fi
          done

  build-linux:
    name: Build Linux (GCC ${{matrix.arch}})
    needs: targets
    if: needs.targets.outputs.linux != '[]'
    runs-on: ${{matrix.runner}}

    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJSON(needs.targets.outputs.linux)}}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install mold libfuse2t64 zlib1g-dev libpng-dev libfreetype-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libusb-1.0-0-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libegl-dev libgles-dev \
            libgl-dev libdrm-dev libgbm-dev libibus-1.0-dev

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure CMake
        run: cmake --preset x-linux-ci

      - name: Build
        run: cmake --build --preset x-linux-ci

      - name: Generate AppImage
        run: ci/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          path: build/install/Metaforce-*.AppImage
          archive: false
          if-no-files-found: error

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: metaforce-${{env.APP_VERSION}}-linux-${{matrix.arch}}-debug
          path: build/install/debug.tar.xz

  build-apple:
    name: Build Apple (${{matrix.name}})
    needs: targets
    if: needs.targets.outputs.apple != '[]'
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJSON(needs.targets.outputs.apple)}}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure CMake
        run: cmake --preset ${{matrix.preset}}

      - name: Build
        run: cmake --build --preset ${{matrix.preset}}

      - name: Package
        run: ${{matrix.package_script}}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          path: ${{matrix.package_path}}
          archive: false
          if-no-files-found: error

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: metaforce-${{env.APP_VERSION}}-${{matrix.target}}-debug
          path: build/install/debug.tar.xz

  build-android:
    name: Build Android (arm64-v8a)
    needs: targets
    if: needs.targets.outputs.android != '[]'
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: "30.0.16248370"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure CMake
        run: cmake --preset x-android-ci-arm64

      - name: Build native library
        run: cmake --build --preset x-android-ci-arm64

      - name: Build APK
        working-directory: platforms/android
        run: ./gradlew :app:assembleRelease

      - name: Stage APK
        run: |
          cp platforms/android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk \
            "build/Metaforce-${APP_VERSION}-android-arm64-unsigned.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: build/Metaforce-*.apk
          archive: false
          if-no-files-found: error

  build-windows:
    name: Build Windows (MSVC ${{matrix.arch}})
    needs: targets
    if: needs.targets.outputs.windows != '[]'
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJSON(needs.targets.outputs.windows)}}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Enable Visual Studio environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{matrix.msvc_arch}}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure CMake
        run: cmake --preset x-windows-ci

      - name: Build
        run: cmake --build --preset x-windows-ci

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: metaforce-${{env.APP_VERSION}}-windows-${{matrix.arch}}
          path: |
            build/install/*.exe
            build/install/*.dll
            build/install/res/
          if-no-files-found: error

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: metaforce-${{env.APP_VERSION}}-windows-${{matrix.arch}}-debug
          path: build/install/debug.7z
